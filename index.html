<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GAB-X AI | Sovereign Hub</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; padding: 20px; font-size: 1.2rem; font-weight: bold; }
        .hero { text-align: center; padding: 40px 20px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .btn { background: #1a1a1a; padding: 15px; border-radius: 25px; border: none; color: #fff; cursor: pointer; text-align: left; }
        #chatDisplay { flex: 1; padding: 20px; overflow-y: auto; }
        .msg { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; }
        .input-area { padding: 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 25px; background: #111; border: 1px solid #444; color: #fff; outline: none; }
        .toggle { background: #333; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <span>GAB-X AI</span>
    <span id="userInitial">A</span>
</div>

<div class="hero">
    <div style="font-size: 1.5rem;">Hi Abubakir</div>
    <div style="font-size: 2rem; margin-top: 10px;">Where should we start?</div>
</div>

<div class="btn-grid">
    <button class="btn">🖼️ Surat yaratish</button>
    <button class="btn">✨ Kunni yaxshilash</button>
    <button class="btn">🎬 Video yaratish (10^1000)</button>
    <button class="btn">🧠 Sovereign Math (10^1000)</button>
</div>

<div id="chatDisplay"></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask GAB-X AI (5+ modellar)..." onkeydown="handleInput(event)">
    <div class="toggle">Multi-Model ⚙️</div>
</div>

<script>
    function handleInput(event) {
        if (event.key === 'Enter') {
            const input = document.getElementById('userInput');
            const display = document.getElementById('chatDisplay');
            display.innerHTML += `<div class="msg"><b>Siz:</b> ${input.value}</div>`;
            display.innerHTML += `<div class="msg"><b>GAB-X AI:</b> Sizning so'rovingiz Multi-Model router orqali qayta ishlanmoqda...</div>`;
            input.value = '';
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GAB-X AI | Sovereign Intelligence</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { padding: 20px; font-weight: bold; border-bottom: 1px solid #333; }
        #chatDisplay { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; padding: 10px; background: #1a1a1a; border-radius: 10px; width: fit-content; max-width: 80%; }
        .input-box { padding: 20px; background: #000; display: flex; align-items: center; }
        #userInput { background: #1a1a1a; border: none; color: #fff; width: 100%; padding: 15px; border-radius: 25px; outline: none; }
    </style>
</head>
<body>

<div class="header" id="userInfo">GAB-X AI - Loading...</div>
<div id="chatDisplay"></div>

<div class="input-box">
    <input type="text" id="userInput" placeholder="Ask GAB-X AI..." onkeydown="handleInput(event)">
</div>

<script>
    // Sizning ma'lumotlaringiz
    const userProfile = {
        name: "Abubakir Abdug'aniyev Juraboyev Qobiljon o'g'li",
        email: "abubakir.juraboyev@gmail.com"
    };
    document.getElementById('userInfo').innerText = `${userProfile.name} | ${userProfile.email}`;

    // Chat funksiyasi
    function handleInput(event) {
        if (event.key === 'Enter') {
            const input = document.getElementById('userInput');
            const chatDisplay = document.getElementById('chatDisplay');
            
            // Foydalanuvchi xabari
            chatDisplay.innerHTML += `<div class="message"><b>Siz:</b> ${input.value}</div>`;
            
            // GAB-X AI javobi (API o'rniga namuna)
            chatDisplay.innerHTML += `<div class="message"><b>GAB-X AI:</b> Sizning GAB-X GLOBAL loyihangiz haqida ma'lumot qidiryapman... (Limitsiz rejim faol).</div>`;
            
            input.value = '';
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }
    }
</script>
</body>
</html>

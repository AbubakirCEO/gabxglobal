<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GAB-X GLOBAL // WEB ENGINE</title>
    <style>
        :root { --bg: #050505; --gold: #FFD700; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; padding: 20px; }
        input { background: #111; border: 1px solid var(--gold); color: #fff; padding: 10px; width: 100%; margin: 10px 0; }
        button { background: var(--gold); color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; }
        .log { border: 1px solid #333; padding: 10px; height: 200px; overflow-y: auto; margin-top: 20px; background: #0a0a0a; }
    </style>
</head>
<body>

    <h2>GAB-X ANALYTICS LAB</h2>
    <input type="text" id="nums" placeholder="Ma'lumotlar (vergul bilan, masalan: 10, 20, 30)">
    <input type="text" id="target" placeholder="Target (Maqsad)">
    <button onclick="runGABX()">HISOB-KITOB</button>

    <div class="log" id="terminal"></div>

    <script>
        // Python mantiqini JavaScript'ga o'tkazilgan ko'rinishi
        function solveComplexMath(nums, target) {
            let n = nums.length;
            let maxVal = Math.max(...nums);
            let delta = maxVal > 0 ? (0.0001 * maxVal) / n : 0.0001;
            
            let scaledNums = nums.map(x => Math.floor(x / delta));
            let scaledTarget = Math.floor(target / delta);
            
            let possibleSums = new Set([0]);
            for (let x of scaledNums) {
                let newSums = new Set();
                for (let s of possibleSums) {
                    if (s + x <= scaledTarget) newSums.add(s + x);
                }
                newSums.forEach(s => possibleSums.add(s));
            }
            return Math.max(...possibleSums) * delta;
        }

        function addLog(text, color = "white") {
            let term = document.getElementById('terminal');
            let time = new Date().toLocaleTimeString();
            term.innerHTML += `<div style="color:${color}">[${time}] > ${text}</div>`;
        }

        function runGABX() {
            try {
                let nums = document.getElementById('nums').value.split(',').map(x => parseInt(x.trim()));
                let target = parseInt(document.getElementById('target').value);
                
                addLog("GAB-X Algoritmi ishga tushdi...", "#FFD700");
                let res = solveComplexMath(nums, target);
                addLog(`Natija: ${res.toFixed(4)}`, "green");
            } catch(e) {
                addLog("Xato: Ma'lumotlarni to'g'ri kiriting!", "red");
            }
        }
    </script>
</body>
</html>

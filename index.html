<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GAB-X AI | Sovereign Intelligence</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-box { position: fixed; bottom: 20px; width: 90%; max-width: 600px; background: #1a1a1a; padding: 15px 25px; border-radius: 30px; display: flex; align-items: center; }
        #userInput { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 1rem; }
    </style>
</head>
<body>

<div class="main-content">
    <h1 id="greeting">Salom!</h1>
    <p>GAB-X GLOBAL haqida istalgan narsani so‘rang.</p>
</div>

<div class="input-box">
    <input type="text" id="userInput" placeholder="Ask GAB-X AI..." onkeydown="handleInput(event)">
</div>

<script>
    // 1. Ismni dinamik aniqlash
    const userName = localStorage.getItem('userName') || "Foydalanuvchi";
    document.getElementById('greeting').innerText = `Salom, ${userName}!`;

    // 2. GAB-X Bilimlar bazasi
    const gabxKnowledge = {
        "GAB-X GLOBAL": "GAB-X GLOBAL — bu Abubakir Abdug'aniyev Juraboyev Qobiljon o'g'li tomonidan asos solingan suveren ekotizim.",
        "Sovereign Tap": "Sovereign Tap — bu GAB-X ekotizimidagi tap-to-earn o'yin mexanikasiga asoslangan innovatsion loyiha.",
        "Maqsad": "Bizning maqsadimiz P vs NP muammosini hal qilish va cheksiz hisoblash quvvatini taqdim etish."
    };

    // 3. Limitsiz Chat funksiyasi
    function handleInput(event) {
        if (event.key === 'Enter') {
            const input = document.getElementById('userInput').value;
            processQuery(input);
        }
    }

    function processQuery(query) {
        // Bu yerda Gemini va OpenAI API routeri ishlaydi
        let response = gabxKnowledge[query] || "GAB-X AI: Men bu savolga javob berish uchun GAB-X serverlariga ulandim. (API javobi bu yerda ko'rinadi)";
        alert(response); 
    }
</script>
</body>
</html>

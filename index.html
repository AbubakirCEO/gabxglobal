<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GAB-X GLOBAL // ENTERPRISE CORE</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0F; color: #FFFFFF; font-family: 'Courier New', monospace; }
        .g-border { border: 2px solid #D4AF37; }
        .g-gold { color: #D4AF37; }
        .g-bg { background-color: #12121A; }
        .control-btn { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; transition: 0.3s; }
        .control-btn:hover { border-color: #D4AF37; color: #D4AF37; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- 1. AUTH MODULE -->
    <div id="auth-box" class="g-bg p-8 rounded-xl g-border max-w-md mx-auto">
        <h2 id="auth-title" class="text-2xl font-bold g-gold mb-6 text-center">TIZIMGA KIRISH</h2>
        <input type="text" id="username" placeholder="Foydalanuvchi nomi" class="w-full p-2 mb-4 bg-black border border-gray-700 rounded text-white">
        <input type="password" id="password" placeholder="Parol" class="w-full p-2 mb-4 bg-black border border-gray-700 rounded text-white">
        <button onclick="handleAuth()" class="w-full bg-[#D4AF37] text-black font-bold py-2 rounded">KIRISH</button>
    </div>

    <!-- 2. RECAPTCHA GATEWAY (Hidden by default) -->
    <div id="recaptcha-gate" class="hidden flex flex-col items-center mt-10">
        <div class="g-recaptcha mb-4" data-sitekey="6Lf9CwktAAAAAD5rdwazE9TFGXP1lEAwHG6fhHy0"></div>
        <button onclick="verifyAccess()" class="bg-[#D4AF37] text-black px-8 py-2 rounded font-bold">DARVOZANI OCHISH</button>
    </div>

    <!-- 3. DASHBOARD (Hidden) -->
    <div id="main-dashboard" class="hidden max-w-2xl mx-auto space-y-8">
        <div class="g-bg p-6 rounded-xl g-border text-center">
            <img id="avatar-img" src="https://via.placeholder.com/100" class="w-24 h-24 mx-auto rounded-full border-2 border-gold mb-4">
            <h2 id="user-display" class="text-2xl font-bold g-gold">Abubakir_CEO</h2>
            <p id="user-status" class="text-green-500">STANDART</p>
        </div>

        <div class="grid grid-cols-2 gap-3" id="menu-grid">
            <!-- 20 ta funksiya -->
            <button onclick="supportSystem()" class="control-btn">1. Support (VIP-MODE)</button>
            <script>for(let i=2; i<=20; i++) document.write(`<button class="control-btn">${i}. Xizmatlar</button>`);</script>
            <button onclick="logout()" class="col-span-2 mt-4 bg-red-900 text-white py-3 rounded-lg font-bold">21. LOG OUT</button>
        </div>
    </div>

    <script>
        function handleAuth() {
            localStorage.setItem('gabx_user', document.getElementById('username').value);
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('recaptcha-gate').classList.remove('hidden');
        }

        function verifyAccess() {
            if(grecaptcha.getResponse().length === 0) return alert("Captcha!");
            document.getElementById('recaptcha-gate').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
        }

        function supportSystem() {
            if(prompt("VIP-CODE ni kiriting:") === "Abubakir_CEO") {
                document.getElementById('user-status').innerHTML = 'DIAMOND VIP <span class="text-blue-500 font-bold">✓</span>';
                localStorage.setItem('is_vip', 'true');
            }
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            if(localStorage.getItem('is_vip') === 'true') 
                document.getElementById('user-status').innerHTML = 'DIAMOND VIP <span class="text-blue-500 font-bold">✓</span>';
        }
    </script>
</body>
</html>
